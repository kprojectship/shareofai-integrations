name: Integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  n8n:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-nodes-shareofai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: n8n-nodes-shareofai/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
  emdash:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shareofai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shareofai/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: emdash-shareofai
          path: shareofai/dist/shareofai-*.tar.gz
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@2.72.1 lint rapidapi/openapi.json
